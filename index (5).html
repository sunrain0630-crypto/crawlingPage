if(hd){hd.innerHTML='<div class="bar"><a class="logo" href="#/">GYEOL<small>결</small></a><div class="rt"><nav id="nv"><a href="#/products">상품 카테고리</a><a href="#/login">로그인</a><a href="#/signup">회원가입</a><a href="#/about">회사소개</a><a href="#/mypage">마이페이지</a></nav><button id="cb" class="cbtn" type="button" aria-label="장바구니 열기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span id="cc">0</span></button><button id="mb" type="button" aria-label="메뉴 열기">메뉴</button></div></div>';

const MAXQ=10,keyOf=(id,o)=>id+'|'+o;
function clean(raw){const m=new Map();(Array.isArray(raw)?raw:[]).forEach(x=>{const p=x&&P.find(y=>y.id===+x.id);if(!p||typeof x.o!=='string')return;
const lb=OPT[p.c].n+': ';if(!x.o.startsWith(lb)||!OPT[p.c].v.includes(x.o.slice(lb.length)))return;
const q=Math.min(MAXQ,Math.floor(+x.q));if(!(q>=1))return;const k=keyOf(p.id,x.o),e=m.get(k);
if(e)e.q=Math.min(MAXQ,e.q+q);else m.set(k,{id:p.id,o:x.o,q})});return[...m.values()]}

lines(){return getCart().map(x=>{const p=P.find(y=>y.id===x.id);return{...x,p,key:keyOf(x.id,x.o),sum:p.p*x.q}})},

const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const _m={};const ld=(k,d)=>{try{const s=localStorage.getItem(k);return s===null?(k in _m?_m[k]:d):JSON.parse(s)}catch(e){return k in _m?_m[k]:d}};
const sv=(k,v)=>{_m[k]=v;try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const getOrders=()=>{const a=ld('gy_orders',[]);return(Array.isArray(a)?a:[]).filter(o=>o&&o.no&&o.t&&Array.isArray(o.items)).map(o=>({...o,items:clean(o.items)})).filter(o=>o.items.length)};
const addOrder=o=>sv('gy_orders',[o,...getOrders()].slice(0,50));
const statusOf=o=>{const s=(Date.now()-o.t)/1000;return s<30?0:s<90?1:s<300?2:3};
const oTotal=o=>o.items.reduce((a,x)=>a+P.find(y=>y.id===x.id).p*x.q,0);
const dt=t=>new Date(t).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'});
document.body.insertAdjacentHTML('beforeend','<div id="cov" class="cov"></div><aside id="cp" class="cp" role="dialog" aria-label="장바구니" aria-hidden="true"><div class="ch"><h2>장바구니</h2><button type="button" id="cx">닫기</button></div><div id="cbd" class="cbd"></div><div id="cft" class="cft"></div></aside>');
function renderCart(){const cc=document.getElementById('cc');if(!cc)return;const L=Cart.lines(),n=Cart.count(),bd=document.getElementById('cbd'),ft=document.getElementById('cft');
cc.textContent=n;

else{bd.innerHTML=L.map(l=>`<div class="ci">${art(l.p)}<div><a href="#/product/${l.p.id}">${l.p.n}</a><small>${l.o}</small><span class="u">${won(l.p.p)}</span><div class="qty"><button type="button" data-a="d" data-k="${l.key}" aria-label="수량 감소">−</button><span>${l.q}</span><button type="button" data-a="u" data-k="${l.key}" aria-label="수량 증가">+</button></div></div><div class="ca"><b>${won(l.sum)}</b><button class="x" type="button" data-a="x" data-k="${l.key}">삭제</button></div></div>`).join('');
ft.innerHTML=`<p class="rw"><span>총 수량</span><b>${n}개</b></p><p class="rw tt"><span>총금액</span><b>${won(Cart.total())}</b></p><button class="btn" type="button" id="go">주문하기</button><p class="cc"><button class="x" type="button" id="ca">장바구니 비우기</button></p>`;}

<script>
const PG={"index": {"t": "GYEOL 결 | 자연의 결을 닮은 생활용품", "h": "<div class=\"hero\"><div class=\"wrap\"><h1>꾸미지 않아도<br>충분한 일상<\/h1><p>자연의 결을 닮은 소재와 단정한 형태로 만든 생활용품<\/p><a class=\"btn\" href=\"#/products\">상품 보기<\/a><\/div><\/div>\n<section><div class=\"wrap msg\"><h2>BRAND<\/h2><p>필요한 만큼만 담고, 오래 쓸 수 있게 만듭니다.<br>결은 덜어내는 디자인으로 매일의 쓰임을 편안하게 합니다.<\/p><\/div><\/section>\n<section class=\"alt\" id=\"products\"><div class=\"wrap\">\n<div class=\"filter\" id=\"fl\"><\/div>\n<h2>NEW<\/h2><p class=\"sub\">신상품<\/p><div class=\"grid\" id=\"g1\"><\/div>\n<h2 style=\"margin-top:80px\">RECOMMEND<\/h2><p class=\"sub\">추천 상품<\/p><div class=\"grid\" id=\"g2\"><\/div>\n<\/div><\/section>", "j": "\nconst cats=['전체','의류','홈','주방','문구'];let cur='전체';\nfunction draw(){document.getElementById('fl').innerHTML=cats.map(c=>`<button type=\"button\" class=\"${c===cur?'on':''}\" data-c=\"${c}\">${c}<\/button>`).join('');\nconst ok=p=>cur==='전체'||p.c===cur;\ndocument.getElementById('g1').innerHTML=P.filter(p=>p.nw&&ok(p)).map(card).join('')||'<p class=\"sub\">해당 상품이 없습니다.<\/p>';\ndocument.getElementById('g2').innerHTML=P.filter(p=>p.rc&&ok(p)).map(card).join('')||'<p class=\"sub\">해당 상품이 없습니다.<\/p>';}\ndocument.getElementById('fl').onclick=e=>{if(e.target.dataset.c){cur=e.target.dataset.c;draw();}};draw();\n"}, "signup": {"t": "회원가입 | GYEOL 결", "h": "<main class=\"form\"><div id=\"box\"><h1>회원가입<\/h1>\n<form id=\"sf\" novalidate>\n<div class=\"f\"><label for=\"uid\">아이디<\/label><input type=\"text\" id=\"uid\" autocomplete=\"username\"><div class=\"hint\">영문, 숫자 4–16자<\/div><div class=\"err\" id=\"e-uid\"><\/div><\/div>\n<div class=\"f\"><label for=\"pw\">비밀번호<\/label><input type=\"password\" id=\"pw\" autocomplete=\"new-password\"><div class=\"hint\">영문과 숫자를 포함한 8자 이상<\/div><div class=\"err\" id=\"e-pw\"><\/div><\/div>\n<div class=\"f\"><label for=\"pw2\">비밀번호 확인<\/label><input type=\"password\" id=\"pw2\" autocomplete=\"new-password\"><div class=\"err\" id=\"e-pw2\"><\/div><\/div>\n<div class=\"f\"><label for=\"nm\">이름<\/label><input type=\"text\" id=\"nm\" autocomplete=\"name\"><div class=\"err\" id=\"e-nm\"><\/div><\/div>\n<div class=\"f\"><label for=\"em\">이메일<\/label><input type=\"email\" id=\"em\" autocomplete=\"email\"><div class=\"err\" id=\"e-em\"><\/div><\/div>\n<label class=\"chk\"><input type=\"checkbox\" id=\"tm\"> [필수] 이용약관 및 개인정보 처리방침에 동의합니다.<\/label><div class=\"err\" id=\"e-tm\"><\/div>\n<button class=\"btn\" type=\"submit\">가입하기<\/button><\/form>\n<p class=\"alt-link\">이미 계정이 있으신가요? <a href=\"#/login\">로그인<\/a><\/p><\/div><\/main>", "j": "\nconst $=id=>document.getElementById(id);\n$('sf').addEventListener('submit',e=>{e.preventDefault();\nconst v={uid:$('uid').value.trim(),pw:$('pw').value,pw2:$('pw2').value,nm:$('nm').value.trim(),em:$('em').value.trim()};\nconst er={};\nif(!v.uid)er.uid='아이디를 입력해 주세요.';else if(!/^[A-Za-z0-9]{4,16}$/.test(v.uid))er.uid='영문, 숫자 4–16자로 입력해 주세요.';\nif(!v.pw)er.pw='비밀번호를 입력해 주세요.';else if(!/^(?=.*[A-Za-z])(?=.*\\d).{8,}$/.test(v.pw))er.pw='영문과 숫자를 포함해 8자 이상 입력해 주세요.';\nif(!v.pw2)er.pw2='비밀번호를 한 번 더 입력해 주세요.';else if(v.pw!==v.pw2)er.pw2='비밀번호가 일치하지 않습니다.';\nif(!v.nm)er.nm='이름을 입력해 주세요.';\nif(!v.em)er.em='이메일을 입력해 주세요.';else if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v.em))er.em='올바른 이메일 형식이 아닙니다.';\nif(!$('tm').checked)er.tm='필수 약관에 동의해 주세요.';\n['uid','pw','pw2','nm','em','tm'].forEach(k=>$('e-'+k).textContent=er[k]||'');\nif(Object.keys(er).length)return;\ntry{localStorage.setItem('gy_user',JSON.stringify({id:v.uid,pw:v.pw,name:v.nm,em:v.em}));}catch(x){}\n$('box').innerHTML=`<div class=\"done\"><h2>가입이 완료되었습니다<\/h2><p>${esc(v.nm)}님, 결에 오신 것을 환영합니다.<br>로그인 후 이용해 주세요.<\/p><a class=\"btn\" href=\"#/login\">로그인하러 가기<\/a><\/div>`;});\n"}, "login": {"t": "로그인 | GYEOL 결", "h": "<main class=\"form\"><div id=\"box\"><h1>로그인<\/h1>\n<form id=\"lf\" novalidate>\n<div class=\"f\"><label for=\"lid\">아이디 또는 이메일<\/label><input type=\"text\" id=\"lid\" autocomplete=\"username\"><div class=\"err\" id=\"e-id\"><\/div><\/div>\n<div class=\"f\"><label for=\"lpw\">비밀번호<\/label><input type=\"password\" id=\"lpw\" autocomplete=\"current-password\"><div class=\"err\" id=\"e-pw\"><\/div><\/div>\n<div id=\"rs\" role=\"alert\"><\/div><button class=\"btn\" type=\"submit\">로그인<\/button><\/form>\n<p class=\"alt-link\">아직 회원이 아니신가요? <a href=\"#/signup\">회원가입<\/a><\/p><\/div><\/main>", "j": "\nconst g=i=>document.getElementById(i);\ng('lf').addEventListener('submit',e=>{e.preventDefault();\nconst id=g('lid').value.trim(),pw=g('lpw').value,er={};\nif(!id)er.id='아이디 또는 이메일을 입력해 주세요.';\nelse if(id.includes('@')?!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(id):!/^[A-Za-z0-9]{4,16}$/.test(id))er.id='아이디(영문·숫자 4–16자) 또는 올바른 이메일 형식으로 입력해 주세요.';\nif(!pw)er.pw='비밀번호를 입력해 주세요.';\ng('e-id').textContent=er.id||'';g('e-pw').textContent=er.pw||'';g('rs').innerHTML='';\nif(er.id||er.pw)return;\nlet u=null;try{u=JSON.parse(localStorage.getItem('gy_user'));}catch(x){}\nconst bad=m=>g('rs').innerHTML=`<div class=\"res bad\">${m}<\/div>`;\nif(!u||(u.id!==id&&u.em!==id))return bad('가입된 회원 정보를 찾을 수 없습니다. 먼저 회원가입을 진행해 주세요.');\nif(u.pw!==pw)return bad('비밀번호가 올바르지 않습니다. 다시 확인해 주세요.');\nsv('gy_session',u.id);g('box').innerHTML=`<div class=\"done\"><h2>로그인되었습니다<\/h2><p>${esc(u.name)}님, 환영합니다.<\/p><div class=\"bt\"><a class=\"btn line\" href=\"#/mypage\">마이페이지<\/a><a class=\"btn\" href=\"#/\">쇼핑 계속하기<\/a><\/div><\/div>`;});\n"}, "about": {"t": "회사소개 | GYEOL 결", "h": "<div class=\"hero\"><div class=\"wrap\"><h1>결을 따라<br>만드는 물건<\/h1><p>GYEOL 결 · 자연의 결을 닮은 생활용품 브랜드<\/p><\/div><\/div>\n<section><div class=\"wrap ab\"><div id=\"i1\"><\/div><div><h2>BRAND<\/h2><p class=\"sub\">브랜드 소개<\/p><p>결(GYEOL)은 나무의 결, 천의 결처럼 자연스러운 흐름을 담은 생활용품 브랜드입니다. 의류, 홈, 주방, 문구까지 일상에서 매일 손이 가는 물건을 만듭니다.<\/p><p>이름이 가리키는 것은 겉모습이 아니라 소재가 가진 본래의 질감입니다. 꾸미기보다 소재를 고르는 일에 시간을 씁니다.<\/p><\/div><\/div><\/section>\n<section class=\"alt\"><div class=\"wrap ab\"><div><h2>PURPOSE<\/h2><p class=\"sub\">설립 취지<\/p><p>필요 이상으로 많은 물건에 둘러싸인 일상에서, 꼭 필요한 만큼만 남기자는 생각으로 시작했습니다.<\/p><p>한 번 쓰고 잊
